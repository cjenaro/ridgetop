<style>
  html, body { height: auto; overflow: auto; font-family: "Avenir Next", system-ui, sans-serif; }
  .board { width: min(100%, 1000px); height: clamp(270px, 62vh, 610px); margin: 16px auto; border: 1px solid #52716a; border-radius: 14px; }
  .testing-bar, .pick-line { width: min(100%, 1000px); margin: 12px auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0 12px; }
  .testing-bar strong { color: #ffcd82; }
  .testing-bar button, .testing-bar select, #inspection button, #inspection select { border: 1px solid #54716c; background: #213a3a; border-radius: 6px; color: inherit; font: inherit; padding: .45em .75em; cursor: pointer; }
  .testing-bar select, #object-list { max-width: min(60vw, 275px); }
  .testing-paused .board { cursor: crosshair; }
  .picked-object { position: absolute; pointer-events: none; border: 1px solid #ffcc76; border-radius: 4px; }
  #inspection { width: min(100%, 1000px); padding: 14px clamp(10px, 2vw, 22px); margin: 16px auto; border: 1px solid #53726a; border-radius: 10px; background: #1a3031; }
  #inspection h2 { margin: 12px 0 3px; }
  #pin-context, #pin-instruction, #testing-status, .pick-line p, figcaption { color: #b5ccbf; font-size: .86rem; }
  #testing-status { width: min(100%, 1000px); margin: 8px auto; padding: 0 12px; overflow-wrap: anywhere; }
  #edit-source { color: #b5ccbf; overflow-wrap: anywhere; }
  .inspection-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 12px; }
  .pin-views { display: flex; gap: 8px; align-items: flex-start; }
  .pin-views figure { flex: 1; min-width: 0; }
  #inspection figure { margin: 0 0 8px; }
  .pin-views canvas, .pin-views img, .game-size canvas { display: block; background: #21393e; }
  .pin-views canvas, .pin-views img { width: 100%; height: auto; }
  #pin-image { touch-action: none; cursor: crosshair; }
  .game-size canvas { max-width: 100%; }
  .pin-form { display: grid; align-content: start; gap: 10px; }
  .pin-form label { display: grid; gap: 4px; }
  .pin-form input, .pin-form textarea { width: 100%; background: #142628; color: inherit; border: 1px solid #637e75; border-radius: 4px; padding: 5px; font: inherit; }
  .pin-form input[type=checkbox] { width: auto; }
  .pin-form details > label { display: block; margin: 6px 0; }
  .pin-form summary { cursor: pointer; color: #ffcd82; }
  .pin-form fieldset { border: 0; padding: 0; margin: 6px 0; }
  .axis-fields { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
  .axis-fields label, .pin-form legend { font-size: .8rem; }
  .review-thread { border-top: 1px solid #53726a; padding-top: 8px; }
  .review-thread p, .review-thread li { white-space: pre-wrap; overflow-wrap: anywhere; }
  .review-thread ul:empty { display: none; }
  @media (max-width: 650px) { .inspection-grid { grid-template-columns: 1fr; } }
</style>
<div id="testing-bar" class="testing-bar">
  <strong>Testing mode</strong>
  <button type="button" id="inspect">Pause &amp; inspect</button>
  <label>Reviews <select id="review-list"><option value="">Choose a review</option></select></label>
  <button type="button" id="refresh-reviews">Refresh reviews</button>
</div>
<section id="inspection" aria-label="Art inspection" hidden>
  <div class="pick-line"><label>Object <select id="object-list"></select></label><p>Click an object on the board or the inventory icon.</p></div>
  <div id="pin-details" hidden>
    <h2 id="pin-title"></h2><p id="pin-context"></p>
    <div class="inspection-grid">
      <div>
        <div class="pin-views">
          <figure id="before-wrap" hidden><figcaption>Before</figcaption><img id="before-image" alt="Saved view before the revision"></figure>
          <figure><figcaption>Current</figcaption><canvas id="pin-image" aria-label="Select a part or drag a sprite region"></canvas></figure>
        </div>
        <figure class="game-size"><figcaption>At game size</figcaption><canvas id="game-size"></canvas></figure>
        <p id="pin-instruction">Click to pin a point or drag to mark a region.</p>
      </div>
      <div class="pin-form">
        <label>Apply feedback to <select id="pin-scope">
          <option value="asset">Shared asset · all uses</option><option value="instance">This scene object</option>
          <option value="sprite">This sprite frame</option><option value="hud">Inventory icon only</option>
        </select><small id="edit-source"></small></label>
        <label id="part-label">Model part <select id="pin-part"></select></label>
        <details id="direct-edit"><summary>Edit this part</summary>
          <fieldset><legend>Position</legend><div id="edit-position" class="axis-fields"></div></fieldset>
          <fieldset><legend>Size</legend><div id="edit-scale" class="axis-fields"></div></fieldset>
          <label><input id="move-part" type="checkbox"> Move selected part by dragging</label>
          <div><button type="button" id="save-part" disabled>Save part to project</button>
          <button type="button" id="discard-part" disabled>Discard edit</button></div>
        </details>
        <div class="review-thread" id="thread" hidden>
          <strong id="thread-status"></strong><p id="thread-comment"></p><ul id="thread-replies"></ul>
          <button type="button" id="compare-latest">Reload latest art</button>
        </div>
        <label><span id="comment-label">Comment for Codex</span><textarea id="review-text" rows="3" maxlength="8000"></textarea></label>
        <div><button type="button" id="save-comment">Save comment</button>
          <button type="button" id="resolve-review" hidden>Resolve</button></div>
      </div>
    </div>
  </div>
</section>
<p id="testing-status" role="status"></p>
