<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142431">
  <title>Tidewatch · Ridgetop</title>
  <link rel="stylesheet" href="/game-ui.css">
  <script type="module" src="/lighthouse/main.js"></script>
</head>
<body class="lighthouse-page" data-hosted="1">
  <main class="game-viewport" aria-label="Tidewatch">

  </main>
