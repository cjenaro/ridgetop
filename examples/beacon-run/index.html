<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111c20">
  <title>Beacon Run · Ridgetop</title>
  <link rel="icon" href="/game/assets/scout.png" type="image/png">
  <link rel="stylesheet" href="/game-ui.css">
  <script type="module" src="/main.js"></script>
</head>
<body class="beacon" data-hosted="1">
  <main class="game-viewport" aria-label="Beacon Run">
    <canvas id="stage" class="playfield" width="960" height="540" tabindex="-1" aria-label="Beacon Run course"></canvas>
    <canvas id="sprites" class="game-layer sprite-layer" width="960" height="540" aria-hidden="true"></canvas>
    <canvas id="beacon-hud" class="game-layer" width="960" height="540" aria-hidden="true"></canvas>
    <canvas id="ui" class="ui-layer" width="960" height="540" aria-label="Beacon Run interface"></canvas>
  </main>
</body>
</html>
